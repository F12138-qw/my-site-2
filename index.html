<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>打字小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #eee; font-family: monospace; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
  #info { display: flex; gap: 30px; padding: 15px; font-size: 20px; }
  #gameArea { width: 600px; height: 400px; border: 2px solid #0f3460; position: relative; background: #16213e; }
  .word { position: absolute; color: #e94560; font-size: 22px; font-weight: bold; }
  .word.hit { color: #00ff88; }
  #input { margin-top: 15px; padding: 10px; font-size: 20px; width: 300px; text-align: center; background: #0f3460; border: none; color: #fff; outline: none; }
  #startBtn { margin-top: 15px; padding: 10px 30px; font-size: 18px; cursor: pointer; background: #e94560; border: none; color: #fff; }
</style>
</head>
<body>
<div id="info">
  <span>分数: <b id="score">0</b></span>
  <span>连击: <b id="combo">0</b></span>
  <span>生命: <b id="lives">5</b></span>
</div>
<div id="gameArea"></div>
<input id="input" type="text" placeholder="在这里打字..." disabled>
<button id="startBtn">开始游戏</button>

<script>
const words = ['hello','world','code','game','type','fast','jump','run','fly','star','moon','fire','ice','dark','light','power','speed','cool','nice','epic'];
let activeWords = [], score = 0, combo = 0, lives = 5, running = false, spawnTimer, speed = 1.5;

const area = document.getElementById('gameArea');
const input = document.getElementById('input');
const btn = document.getElementById('startBtn');

btn.onclick = startGame;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') checkWord();
});

function startGame() {
  score = 0; combo = 0; lives = 5; speed = 1.5;
  activeWords = []; area.innerHTML = '';
  updateInfo(); running = true;
  input.disabled = false; input.value = ''; input.focus();
  btn.style.display = 'none';
  spawnTimer = setInterval(spawnWord, 1200);
  requestAnimationFrame(loop);
}

function spawnWord() {
  if (!running) return;
  const w = words[Math.floor(Math.random() * words.length)];
  const el = document.createElement('div');
  el.className = 'word';
  el.textContent = w;
  el.style.left = Math.random() * 500 + 'px';
  el.style.top = '0px';
  area.appendChild(el);
  activeWords.push({ el, text: w, y: 0 });
  speed += 0.02;
}

function loop() {
  if (!running) return;
  for (let i = activeWords.length - 1; i >= 0; i--) {
    const w = activeWords[i];
    w.y += speed;
    w.el.style.top = w.y + 'px';
    if (w.y > 380) {
      w.el.remove(); activeWords.splice(i, 1);
      lives--; combo = 0; updateInfo();
      if (lives <= 0) gameOver();
    }
  }
  requestAnimationFrame(loop);
}

function checkWord() {
  const val = input.value.trim().toLowerCase();
  input.value = '';
  const idx = activeWords.findIndex(w => w.text === val);
  if (idx !== -1) {
    activeWords[idx].el.classList.add('hit');
    setTimeout(() => activeWords[idx]?.el.remove(), 200);
    activeWords.splice(idx, 1);
    score += 10 + combo * 2; combo++;
    updateInfo();
  } else { combo = 0; updateInfo(); }
}

function updateInfo() {
  document.getElementById('score').textContent = score;
  document.getElementById('combo').textContent = combo;
  document.getElementById('lives').textContent = lives;
}

function gameOver() {
  running = false; clearInterval(spawnTimer);
  input.disabled = true; btn.style.display = 'block';
  btn.textContent = `游戏结束！分数 ${score}，再来一次`;
}
</script>
</body>
</html>
